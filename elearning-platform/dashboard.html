<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الطالب — منصة طاهر البيلي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'%3E%3Cpath d='M22 10L12 5 2 10l10 5 10-5z'/%3E%3Cpath d='M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">
  <div class="side-backdrop" id="sideBackdrop"></div>

  <aside class="app-side" id="appSide">
    <div class="side-brand">
      <a class="logo" href="index.html"><span class="mark" id="logoMark"></span><span>منصة طاهر البيلي</span></a>
    </div>
    <nav class="side-nav" id="sideNav">
      <a href="#overview" data-sec="overview"></a>
      <a href="#courses" data-sec="courses"></a>
      <a href="#quizzes" data-sec="quizzes"></a>
      <a href="#certificates" data-sec="certificates"></a>
      <a href="#subscriptions" data-sec="subscriptions"></a>
      <a href="#notifications" data-sec="notifications"><span class="nav-count hidden" id="notifCount"></span></a>
      <a href="#support" data-sec="support"></a>
      <a href="#settings" data-sec="settings"></a>
      <span class="side-label">تصفح</span>
      <a href="courses.html"></a>
      <a href="index.html"></a>
    </nav>
    <div class="side-foot">
      <div class="side-user" id="sideUser"></div>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-top">
      <button class="icon-btn drawer-btn" id="drawerBtn" aria-label="القائمة"></button>
      <h1 id="secTitle">نظرة عامة</h1>
      <div class="top-actions">
        <button class="icon-btn" data-theme-toggle aria-label="تبديل الوضع الليلي"></button>
      </div>
    </header>
    <div class="content" id="secContent"></div>
  </div>
</div>

<!-- نافذة الاختبار -->
<div class="modal-backdrop" id="quizModal">
  <div class="modal wide">
    <div class="modal-head"><h3 id="qmTitle">الاختبار</h3><button class="close-m" onclick="closeModal('quizModal')"></button></div>
    <div class="modal-body" id="qmBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('quizModal')">إلغاء</button>
      <button class="btn btn-primary" id="qmSubmit">تسليم الاختبار</button>
    </div>
  </div>
</div>

<!-- نافذة محادثة الدعم -->
<div class="modal-backdrop" id="threadModal">
  <div class="modal">
    <div class="modal-head"><h3 id="tmTitle">المحادثة</h3><button class="close-m" onclick="closeModal('threadModal')"></button></div>
    <div class="modal-body" id="tmBody"></div>
    <div class="modal-foot">
      <input type="text" id="tmReply" class="input" placeholder="أضف رداً أو توضيحاً..." style="flex:1">
      <button class="btn btn-primary" id="tmSend"></button>
    </div>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
