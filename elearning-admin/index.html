<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الإدارة — منصة طاهر البيلي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'%3E%3Cpath d='M22 10L12 5 2 10l10 5 10-5z'/%3E%3Cpath d='M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- بوابة دخول الإدارة (تظهر فقط لغير المسجلين) -->
<div class="auth-page hidden" id="admGate">
  <div class="auth-brand"><a class="logo" href="index.html"><span class="mark" id="gateMark"></span><span>لوحة الإدارة</span></a></div>

  <div class="auth-card">
    <div class="auth-head" style="display:block;text-align:center">
      <h2 style="margin:0 0 6px;font-size:20px;font-weight:800">دخول لوحة تحكم الإدارة</h2>
      <p style="margin:0;color:#64748b;font-size:14px">هذه المنطقة مخصصة للمديرين والمشرفين فقط —طلاب المنصة يسجلون دخولهم من رابط المنصة</p>
    </div>
    <div class="auth-body">
      <form id="gateForm" novalidate>
        <div class="field">
          <label>بريد المشرف</label>
          <input type="email" id="gEmail" placeholder="example@gmail.com" autocomplete="username" required>
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input type="password" id="gPass" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <p class="err hidden" id="gErr"></p>
        <button type="submit" class="btn btn-dark btn-block btn-lg mt-1">دخول لوحة الإدارة</button>
      </form>
    </div>
  </div>
</div>

<!-- اللوحة نفسها (تظهر بعد الدخول) -->
<div class="app hidden" id="appRoot">
  <div class="side-backdrop" id="sideBackdrop"></div>

  <aside class="app-side" id="appSide">
    <div class="side-brand">
      <a class="logo" href="index.html"><span class="mark" id="logoMark" style="background:var(--grad-dark)"></span><span>لوحة الإدارة</span></a>
    </div>
    <nav class="side-nav" id="sideNav">
      <a href="#overview" data-sec="overview" data-perm="*"></a>
      <a href="#students" data-sec="students" data-perm="students"></a>
      <a href="#courses" data-sec="courses" data-perm="courses"></a>
      <a href="#finance" data-sec="finance" data-perm="finance"></a>
      <a href="#quizzes" data-sec="quizzes" data-perm="quizzes"></a>
      <a href="#content" data-sec="content" data-perm="content"></a>
      <a href="#support" data-sec="support" data-perm="support"><span class="nav-count hidden" id="msgCount"></span></a>
      <a href="#security" data-sec="security" data-perm="security"></a>
      <span class="side-label">الموقع</span>
      <a href="../elearning-platform/index.html"></a>
    </nav>
    <div class="side-foot">
      <div class="side-user" id="sideUser"></div>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-top">
      <button class="icon-btn drawer-btn" id="drawerBtn" aria-label="القائمة"></button>
      <h1 id="secTitle">لوحة التحكم</h1>
      <div class="top-actions">
        <button class="icon-btn" data-theme-toggle aria-label="تبديل الوضع الليلي"></button>
      </div>
    </header>
    <div class="content" id="secContent"></div>
  </div>
</div>

<!-- نافذة عامة (تُملأ حسب الحاجة) -->
<div class="modal-backdrop" id="admModal">
  <div class="modal wide" id="admModalBox">
    <div class="modal-head"><h3 id="admTitle">نافذة</h3><button class="close-m" onclick="closeModal('admModal')"></button></div>
    <div class="modal-body" id="admBody"></div>
    <div class="modal-foot" id="admFoot"></div>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/admin-extra.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
